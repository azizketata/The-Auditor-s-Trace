# TEST FIXTURE — NOT the §11 crosswalk deliverable.
#
# rules/crosswalk.yaml is human-authored content (BUILD-PLAN §11); the harness
# never generates it. This file exists so the Phase 6 loader, renderer, CLI,
# and goldens are exercised end-to-end BEFORE that file lands: substantive
# stand-in content, clearly labelled. When the human-authored crosswalk
# arrives, the loader validates it unchanged and the evidence goldens are
# re-cut in a deliberate, diff-reviewed commit (pre-freeze).
#
# legal_basis entries are copied verbatim from rules/rules.yaml so the
# cross-validation (severity + article sets) passes by construction.
# standard_refs are plausible FIXTURE mappings, not verified citations.

crosswalk_version: "fixture-2026-08"
author: "build harness (test fixture, not a human-authored crosswalk)"

constraints:
  - constraint_id: T1.synchronised_approval
    natural_language: >-
      For every decision whose outcome requires human approval (grant, deny),
      a human approver holding an authorised role must have granted approval
      for that same decision strictly before the decision was made.
    legal_basis:
      - instrument: "Regulation (EU) 2024/1689"
        article: "14"
        paragraph: "4(d)"
        requirement: >-
          Human oversight measures must enable the persons overseeing the
          high-risk AI system to decide not to use it or to disregard,
          override or reverse its output.
      - instrument: "Regulation (EU) 2024/1689"
        article: "26"
        paragraph: "2"
        requirement: >-
          Deployers assign human oversight to natural persons who have the
          necessary competence, training and authority.
    standard_refs:
      - standard: "ISO/IEC 42001"
        control: "A.9.2 human oversight of decisions (fixture mapping)"
      - framework: "NIST AI RMF"
        function: "GOVERN"
    severity: high

  - constraint_id: T2.mandatory_data_coverage
    natural_language: >-
      Every credit decision must rest on retrievals that cover all mandated
      data source types for the application concerned.
    legal_basis:
      - instrument: "Regulation (EU) 2024/1689"
        article: "10"
        paragraph: "3"
        requirement: >-
          Training, validation and testing data sets must be relevant,
          sufficiently representative and, to the best extent possible,
          complete in view of the intended purpose.
      - instrument: "Regulation (EU) 2024/1689"
        article: "15"
        paragraph: "1"
        requirement: >-
          High-risk AI systems must achieve an appropriate level of accuracy
          and robustness and perform consistently throughout their lifecycle.
    standard_refs:
      - standard: "ISO/IEC 24970"
        clause: "6.3 event completeness in AI system logging (fixture mapping)"
      - framework: "NIST AI RMF"
        function: "MAP"
    severity: medium

  - constraint_id: T3.delegation_integrity
    natural_language: >-
      No agent may act within a session without a preceding handoff
      delegating control to it, unless it is the session entrypoint; and no
      delegation chain within a session may contain a cycle.
    legal_basis:
      - instrument: "Regulation (EU) 2024/1689"
        article: "14"
        paragraph: "2"
        requirement: >-
          Human oversight aims at preventing or minimising the risks that
          emerge when a high-risk AI system is used in accordance with its
          intended purpose or under reasonably foreseeable misuse.
      - instrument: "Regulation (EU) 2024/1689"
        article: "26"
        paragraph: "1"
        requirement: >-
          Deployers use high-risk AI systems in accordance with the
          instructions for use accompanying the systems.
    standard_refs:
      - standard: "ISO/IEC 42001"
        control: "A.6.2 accountability for delegated actions (fixture mapping)"
    severity: medium

  - constraint_id: T4.reason_code_presence
    natural_language: >-
      Every adverse decision (deny, refer) must carry non-empty reason codes
      on the decision object and be explained by at least one reasoning event
      referencing that same decision.
    legal_basis:
      - instrument: "Regulation (EU) 2024/1689"
        article: "13"
        paragraph: "1"
        requirement: >-
          High-risk AI systems must be sufficiently transparent for deployers
          to interpret the system's output and use it appropriately.
      - instrument: "Regulation (EU) 2024/1689"
        article: "86"
        paragraph: "1"
        requirement: >-
          Affected persons have the right to obtain from the deployer a clear
          and meaningful explanation of the role of the AI system in the
          decision-making procedure.
    standard_refs:
      - standard: "ISO/IEC 24970"
        clause: "7.1 traceability of automated decisions (fixture mapping)"
      - framework: "NIST AI RMF"
        function: "MEASURE"
    severity: medium

  - constraint_id: T5.prohibited_attribute_access
    natural_language: >-
      No retrieval or model call concerning an application may read a
      special-category data resource unless that resource carries a recorded
      lawful basis documenting the bias-examination purpose.
    legal_basis:
      - instrument: "Regulation (EU) 2024/1689"
        article: "10"
        paragraph: "2(f)-(g)"
        requirement: >-
          Data governance must cover examination in view of possible biases
          and appropriate measures to detect, prevent and mitigate them.
    standard_refs:
      # Deliberately non-ASCII: the ensure_ascii=False tripwire that flows
      # through canonical JSON into the evidence goldens.
      - standard: "ISO/IEC 42001"
        control: "A.7.4 Prüfung auf Verzerrungen in Datenbeständen (fixture mapping)"
    severity: high

  - constraint_id: STD.policy_version_current
    natural_language: >-
      Every decision must be governed by the policy version in force at
      decision time; a decision governed by a superseded policy version (one
      whose validity has ended) violates the constraint.
    legal_basis:
      - instrument: "Regulation (EU) 2024/1689"
        article: "72"
        paragraph: "1"
        requirement: >-
          Providers establish and document a post-market monitoring system
          proportionate to the nature of the AI technologies and the risks
          of the high-risk AI system.
      - instrument: "Regulation (EU) 2024/1689"
        article: "72"
        paragraph: "2"
        requirement: >-
          The post-market monitoring system actively and systematically
          collects and analyses relevant data on performance throughout the
          systems' lifetime, allowing the provider to evaluate continuous
          compliance with the requirements.
    standard_refs:
      - standard: "ISO/IEC 42001"
        control: "A.8.4 change control for governing policies (fixture mapping)"
    severity: medium

retention:
  class: ai_act_art_26_6
  min_retention_months: 6
  note: "financial institutions: retain per applicable Union financial services law"
