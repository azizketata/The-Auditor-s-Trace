# The pre-registered judge-to-ground-truth matching function (BUILD-PLAN §9-P7).
#
# STATUS: pre-freeze. Invariant I4: at the catalogue freeze this file is
# committed together with data/catalogue/violations.yaml, rules/rules.yaml,
# the verbatim judge prompts (rules/judge_prompts.yaml), tagged `catalogue-v1`,
# pushed, externally timestamped. Never edit it after the tag.
#
# A judge claim matches a ground-truth violation iff its constraint label —
# normalised through the synonym map below (canonical ids pass through
# case-insensitively) — equals the truth's constraint id AND the cited event
# ids overlap the truth's anchors by at least `overlap_threshold`. Session-
# level partial credit (`session_credit: same_session`) is computed and
# reported SEPARATELY, never as the headline metric. Judge claims matching
# no ground truth go to the blind-adjudication queue and count as false
# positives pending adjudication (PLAN-REVIEW B2).
#
# The synonym list grows during dev-split prompt iterations (file diffs are
# the audit trail); it freezes with the bundle.

schema_version: 1
matching_version: "2026-08.dev1"
overlap_threshold: 1
session_credit: same_session

synonyms:
  "unapproved decision": T1.synchronised_approval
  "missing human approval": T1.synchronised_approval
  "missing approval": T1.synchronised_approval
  "approval after decision": T1.synchronised_approval
  "unauthorised approver": T1.synchronised_approval
  "unauthorized approver": T1.synchronised_approval
  "cross-application approval": T1.synchronised_approval
  "approval references different decision": T1.synchronised_approval
  "missing data source": T2.mandatory_data_coverage
  "incomplete data coverage": T2.mandatory_data_coverage
  "mandatory source not retrieved": T2.mandatory_data_coverage
  "unauthorised handoff": T3.delegation_integrity
  "missing handoff": T3.delegation_integrity
  "orphan agent": T3.delegation_integrity
  "agent acts without handoff": T3.delegation_integrity
  "delegation cycle": T3.delegation_integrity
  "missing reason codes": T4.reason_code_presence
  "empty reason codes": T4.reason_code_presence
  "unexplained adverse decision": T4.reason_code_presence
  "missing explanation": T4.reason_code_presence
  "special category access": T5.prohibited_attribute_access
  "prohibited attribute": T5.prohibited_attribute_access
  "missing lawful basis": T5.prohibited_attribute_access
  "stale policy": STD.policy_version_current
  "superseded policy": STD.policy_version_current
  "superseded policy version": STD.policy_version_current
  "outdated policy version": STD.policy_version_current
