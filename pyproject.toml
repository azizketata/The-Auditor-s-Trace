[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditors-trace"
version = "0.1.0"
description = "Deterministic EU AI Act audit evidence from LLM-agent telemetry via object-centric process mining"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aziz Ketata" },
    { name = "Alina Hafner" },
]

# Core: everything on the deterministic analysis path.
dependencies = [
    "pm4py==2.7.23.4",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# The subject under test. Never imported by the analysis path (invariant I2).
scenario = [
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "openinference-instrumentation-langchain==0.1.70",
    "langgraph==1.2.11",
    "langchain==1.3.15",
]
# Tables and figures only. Never in the deterministic path.
eval = [
    "pandas==3.0.5",
    "matplotlib==3.11.1",
]

[project.scripts]
auditors-trace = "auditors_trace.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.165.3",
    "ruff==0.16.2",
    "mypy==2.3.0",
    "types-PyYAML==6.0.12.20250915",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auditors_trace"]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["auditors_trace"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

# None of these ship py.typed; --strict rejects untyped imports without this.
[[tool.mypy.overrides]]
module = [
    "pm4py.*",
    "langchain.*",
    "langgraph.*",
    "openinference.*",
    "matplotlib.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
