[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditors-trace"
version = "0.1.0"
description = "Deterministic EU AI Act audit evidence from LLM-agent telemetry via object-centric process mining"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aziz Ketata" },
    { name = "Alina Hafner" },
]

# Core: everything on the deterministic analysis path.
dependencies = [
    "pm4py==2.7.23.4",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# The subject under test. Never imported by the analysis path (invariant I2).
scenario = [
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "openinference-instrumentation-langchain==0.1.70",
    "langgraph==1.2.11",
    "langchain==1.3.15",
    "langchain-anthropic==1.5.5",
]
# Tables and figures only. Never in the deterministic path.
eval = [
    "pandas==3.0.5",
    "matplotlib==3.11.1",
]
# The LLM-as-judge baseline (invariant I2's second and last LLM site).
# Already present transitively via langchain-anthropic; declared here so
# baselines/llm_judge.py never depends on an undeclared package
# (BUILD-PLAN section 4 row added by the Phase 7 amendment, user-approved).
judge = [
    "anthropic==0.121.0",
]

[project.scripts]
auditors-trace = "auditors_trace.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.165.3",
    "ruff==0.16.2",
    "mypy==2.3.0",
    "types-PyYAML==6.0.12.20250915",
    "jsonschema==4.26.0",  # OCEL 2.0 official-schema validation in tests only; never imported by src/
]

[tool.hatch.build.targets.wheel]
packages = ["src/auditors_trace"]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["auditors_trace"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

# Only pm4py, pandas, and matplotlib lack a py.typed marker; langchain,
# langgraph, opentelemetry, and openinference all ship one, so --strict
# checks our use of them for real. pandas crosses our code solely at the
# model/io.py boundary, where every value is isinstance-narrowed on entry.
[[tool.mypy.overrides]]
module = [
    "pm4py.*",
    "pandas.*",
    "matplotlib.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: requires internet access; excluded from the hermetic suite",
]
